<html >
<head>
    <title>Hospital Appointment Management</title>
</head>
<body>
    <header>
        <h1>City Care Hospital</h1>
        <p>Your Health, Our Priority</p>
    </header>
    <main>

        <section id="home">
            <h2>Welcome to City Care Hospital</h2>
            <p>
                City Care Hospital provides quality healthcare services
                with experienced doctors and modern medical facilities.
            </p>
        </section>
        <!-- APPOINTMENT FORM -->
        <section id="appointment">
            <h2>Patient Appointment Form</h2>
            <form action="#" method="post">
                <fieldset>
                    <legend>Patient Information</legend>
                    <label for="name">Patient Full Name:</label><br>
                    <input type="text" id="name" name="name"d>
                    <br><br>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email">
                    <br><br>
                    <label for="phone">Phone Number:</label><br>
                    <input type="tel" id="phone" name="phone">
                    <br><br>
                    <label for="age">Age:</label><br>
                    <input type="number" id="age" name="age">
                    <br><br>
                    <p>Select Gender:</p>
                    <input type="radio" id="male" name="gender" value="Male" required>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                    <input type="radio" id="other" name="gender" value="Other">
                    <label for="other">Other</label>
                    <br><br>
                </fieldset>
                <fieldset>
                    <legend>Appointment Details</legend>
                    <label for="department">Select Department:</label><br>
                    <select id="department" name="department" required>
                        <option value="">Choose Department</option>
                        <option value="Cardiology">Cardiology</option>
                        <option value="Orthopedics">Orthopedics</option>
                        <option value="General Medicine">General Medicine</option>
                        <option value="Neurology">Neurology</option>
                    </select>
                    <br><br>
                    <label for="doctor">Select Doctor:</label><br>
                    <select id="doctor" name="doctor" required>
                        <option value="">Choose Doctor</option>
                        <option value="Dr. Ravi Kumar">Dr. Ravi Kumar</option>
                        <option value="Dr. Priya Sharma">Dr. Priya Sharma</option>
                        <option value="Dr. Arjun Rao">Dr. Arjun Rao</option>
                    </select>
                    <br><br>
                    <label for="date">Appointment Date:</label><br>
                    <input type="date" id="date" name="date" required>
                    <br><br>
                    <button type="submit">Book Appointment</button>
                    <button type="reset">Clear Form</button>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
